name: Demo (GitHub Pages)

# Builds the static demo and publishes it to the gh-pages branch
# (Pages source: "Deploy from a branch" → gh-pages / root).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @quizplayer/core
      - run: node scripts/build-demo.mjs && touch demo-dist/.nojekyll
      - name: Push to gh-pages
        working-directory: demo-dist
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy demo from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
