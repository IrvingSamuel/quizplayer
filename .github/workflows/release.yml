name: Release (npm)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'IrvingSamuel/quizplayer' }}
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: |
          for p in core react vue server; do
            npm publish -w @quizplayer/$p --access public --provenance
          done
