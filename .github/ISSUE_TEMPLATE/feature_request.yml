name: ✨ Feature request
description: Suggest an idea or a new integration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'd like to help implement this
